/* v6: original white-card mobile layout, navy only outside the cards */
body{background:#152c49}
.topbar{max-width:634px;margin:16px auto 0;background:#fff;border:0;border-radius:20px;padding:calc(18px + env(safe-area-inset-top)) 18px 19px;box-shadow:0 4px 24px rgba(0,0,0,.06)}

.group-sub{font-size:19px;font-weight:700;color:var(--ink);border-left:1px solid #b7c5d5;padding-left:10px}

.topbar-content{position:relative;align-items:center;gap:4px}
.header-title{min-width:0;flex:1}
.header-title h1{font-size:clamp(17px,4.9vw,24px);line-height:1.35;margin:0;letter-spacing:-.025em}

 .topbar{min-height:132px;padding-top:12px}

<section class="group" id="group-1f" style="order:1"><h2><span class="group-accent"></span>1F <span class="group-sub">通常業務</span></h2><div class="task-list" id="list-1f"><label class="task-row demo-row"><input class="demo-check" data-index="0" id="demo-check-0" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">食堂の床掃除</span></span><span class="task-time demo-time" hidden=""></span></label><label class="task-row demo-row"><input class="demo-check" data-index="1" id="demo-check-1" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">共同トイレの掃除</span></span><span class="task-time demo-time" hidden=""></span></label><label class="task-row demo-row"><input class="demo-check" data-index="2" id="demo-check-2" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">廊下掃除</span></span><span class="task-time demo-time" hidden=""></span></label><label class="task-row demo-row"><input class="demo-check" data-index="3" id="demo-check-3" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">洗濯物の片付け</span></span><span class="task-time demo-time" hidden=""></span></label><label class="task-row demo-row"><input class="demo-check" data-index="4" id="demo-check-4" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">献立表の書き換え</span></span><span class="task-time demo-time" hidden=""></span></label><label class="task-row demo-row"><input class="demo-check" data-index="5" id="demo-check-5" type="checkbox"/><span aria-hidden="true" class="task-check"></span><span class="task-body"><span class="task-name">職員トイレの掃除</span></span><span class="task-time demo-time" hidden=""></span></label></div></section>

<div class="progress-track demo-track"><span class="demo-segment" id="demo-segment-0"></span><span class="demo-segment" id="demo-segment-1"></span><span class="demo-segment" id="demo-segment-2"></span><span class="demo-segment" id="demo-segment-3"></span><span class="demo-segment" id="demo-segment-4"></span><span class="demo-segment" id="demo-segment-5"></span><span class="demo-segment" id="demo-segment-6"></span><span class="demo-segment" id="demo-segment-7"></span><span class="demo-segment" id="demo-segment-8"></span><span class="demo-segment" id="demo-segment-9"></span><span class="demo-segment" id="demo-segment-10"></span></div>

</section>
<section class="note-box" style="order:2"><div class="note-heading"><h2>特記事項・引き継ぎ</h2><span class="note-save-status" id="note-save-status"></span></div>
<label class="caption" for="note">デモ用のメモ欄（個人情報は入力しないでください）</label>
<textarea id="note" maxlength="600" placeholder="例：乾燥待ちの洗濯物があります" rows="3"></textarea>
<div class="note-actions"><button class="save-button" id="save-note">内容を保存</button></div>
</section>
<footer style="order:4">操作体験用のデモです。入力した内容は他の人と共有されません。</footer>
<div class="demo-actions" style="order:3"><small>実際の施設データには影響しません</small><button class="demo-reset" id="reset-demo">最初に戻す</button></div></main>
<script>
(function(){
 const checks=[...document.querySelectorAll('.demo-check')];
 const $=id=>document.getElementById(id);
 function update(){
  const done=checks.filter(x=>x.checked).length;
  const regular=checks.slice(0,8).filter(x=>x.checked).length;
  $('progress-count').textContent=done+' / 11';
  $('progress-fill').style.width=(done/11*100)+'%';
  $('regular-progress').textContent=regular+' / 8';
  $('support-progress').textContent=(done-regular)+' / 3';
  $('remaining').textContent='残り '+(11-done)+' 件';
 }
 checks.forEach(ch=>ch.addEventListener('change',()=>{
  const time=ch.closest('.demo-row').querySelector('.demo-time');
  time.hidden=!ch.checked;
  time.textContent=ch.checked?new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'';
  update();
 }));
 $('reset-demo').addEventListener('click',()=>{
  checks.forEach(ch=>{ch.checked=false;const t=ch.closest('.demo-row').querySelector('.demo-time');t.hidden=true;t.textContent='';});
  $('note').value='';$('note-save-status').textContent='';update();
 });
 $('save-note').addEventListener('click',()=>{$('note-save-status').textContent='デモ内で確認しました';});
 $('note').addEventListener('input',()=>{$('note-save-status').textContent='';});
 update();
})();
</script></body>
