<body>
<div id="mainPage">

<section><h2>2F 清掃（4項目）</h2><div id="floor2"><button type="button" class="row" data-i="11" aria-pressed="false"><span class="box"></span><span class="label">女性更衣室</span><span class="time"></span></button>

<div class="page-nav"><button type="button" id="openSettings">⚙ 印刷・設定ページ</button></div>
</div>

<div class="settings-title">⚙ 印刷・設定ページ</div>

<script type="module">

function update(){let total=0,f1=0,f2=0;buttons.forEach((b,i)=>{const v=normalize(state[i]);if(v){total++;if(i<11)f1++;else f2++}b.disabled=!authReady||!online||pending;b.classList.toggle('done',!!v);b.setAttribute('aria-pressed',v?'true':'false');b.querySelector('.box').textContent=v?'✓':'';const t=b.querySelector('.time');t.textContent=v?(v.name?v.name+' ':'')+v.time:'';t.title=v?.name||''});$('progress').textContent=total+' / 15 完了';$('fill').style.width=total/15*100+'%';$('split').textContent='1F '+f1+' / 11件　・　2F '+f2+' / 4件';$('staffLabel').textContent='職員名：'+(staff||'未登録')}
function checkDay(){$('todayDate').textContent=displayDate(new Date());const next=dayKey(new Date());if(next!==activeDay){activeDay=next;state=Array(15).fill(null);update();if(db&&authReady)connectDay()}}
function openDialog(id){$(id).classList.add('open')}
function closeDialog(id){$(id).classList.remove('open')}
function askStaff(){$('staffInput').value=staff;openDialog('staffDialog');$('staffInput').focus()}
$('changeStaff').onclick=askStaff;

$('undoCancel').onclick=()=>{undoIndex=-1;closeDialog('undoDialog')};
$('undoConfirm').onclick=()=>{const i=undoIndex;undoIndex=-1;closeDialog('undoDialog');if(i>=0)saveCheck(i,true)};

async function saveCheck(i,remove){if(!staff){askStaff();return}if(!authReady||!online||pending)return;const target=doc(db,'cleaning_days',activeDay),actionDay=activeDay,actor=staff;pending=true;setStatus('保存中…');update();try{await runTransaction(db,async tx=>{if(dayKey(new Date())!==actionDay)throw new Error('日付が切り替わりました');const snap=await tx.get(target);let old=snap.exists()&&Array.isArray(snap.data().state)?snap.data().state:Array(15).fill(null);if(old.length!==15)throw new Error('記録形式が不正です');const next=old.slice(),existing=normalize(next[i]);if(remove){if(!existing||existing.name!==actor)throw new Error('別の職員の記録は解除できません');next[i]=null}else{if(existing)throw new Error('ほかの端末ですでにチェック済みです');next[i]={name:actor,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tokyo'})}}if(dayKey(new Date())!==actionDay)throw new Error('日付が切り替わりました');tx.set(target,{state:next,updatedAt:Date.now()})});setStatus('保存完了 ✓');clearError()}catch(e){setStatus('保存失敗');showError('保存エラー',e)}finally{pending=false;update()}}
function connectDay(){if(unsubscribe)unsubscribe();const g=++generation;online=false;update();clearError();setStatus('同期接続中…');unsubscribe=onSnapshot(doc(db,'cleaning_days',activeDay),snap=>{if(g!==generation)return;const arr=snap.exists()?snap.data().state:null;state=Array.isArray(arr)&&arr.length===15?arr.map(normalize):Array(15).fill(null);online=!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites;setStatus(online?'共有中 ✓':'通信待ち');update()},e=>{if(g!==generation)return;online=false;update();setStatus('接続エラー');showError('共有接続',e)})}
function showPage(page){const settings=page==='settings';$('mainPage').hidden=settings;$('settingsPage').hidden=!settings;window.scrollTo(0,0)}
$('openSettings').onclick=()=>showPage('settings');
$('backToCleaning').onclick=()=>showPage('main');
$('retryConnect').onclick=()=>{if(authReady&&db)connectDay();else location.reload()};
const jstMonthParts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit'}).formatToParts(new Date());const mp={};jstMonthParts.forEach(p=>mp[p.type]=p.value);$('printMonth').value=mp.year+'-'+mp.month;
$('printMonth').addEventListener('change',()=>{$('printPreviewButton').style.display='none';$('printStatus').textContent='月を選んで記録を読み込んでください'});
// iOS Safari can spend time preparing its native print preview. Give immediate feedback,
// prevent repeated taps, and restore controls after the print dialog closes.
let printBusy=false;
function finishPrint(){
  printBusy=false;
  $('printPreviewButton').disabled=false;
  $('printPreviewButton').textContent='印刷プレビューを開く';
  $('printStatus').textContent='印刷プレビューの操作が完了しました。必要なら再度開けます';

window.addEventListener('afterprint',finishPrint);
$('printPreviewButton').onclick=()=>{
  if(printBusy)return;
  printBusy=true;
  const button=$('printPreviewButton');
  button.disabled=true;
  button.textContent='印刷画面を準備中…';
  $('printStatus').textContent='iPhoneの印刷画面を準備しています。表示まで時間がかかる場合があります';

  // setTimeout / await before print() can prevent the dialog from opening.
  try{window.print()}catch(e){finishPrint();showError('印刷',e)}

  setTimeout(()=>{if(printBusy){printBusy=false;button.disabled=false;button.textContent='印刷プレビューを開く'}},45000);
};
$('printButton').onclick=async()=>{$('printPreviewButton').style.display='none';if(!authReady||!online){$('printStatus').textContent='共有接続後に印刷できます';return}const month=$('printMonth').value;if(!/^\d{4}-\d{2}$/.test(month))return;const [year,m]=month.split('-').map(Number),days=new Date(Date.UTC(year,m,0)).getUTCDate();$('printButton').disabled=true;$('printStatus').textContent='月間履歴を読み込み中…';try{const data=[];for(let d=1;d<=days;d++){const key=month+'-'+String(d).padStart(2,'0');const snap=await getDoc(doc(db,'cleaning_days',key));const a=snap.exists()?snap.data().state:null;data.push(Array.isArray(a)&&a.length===15?a.map(normalize):Array(15).fill(null))}const table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');const th=document.createElement('th');th.textContent='清掃場所';tr.append(th);for(let d=1;d<=days;d++){const c=document.createElement('th');c.textContent=d;tr.append(c)}thead.append(tr);table.append(thead);const tbody=document.createElement('tbody');names.forEach((name,i)=>{const row=document.createElement('tr'),head=document.createElement('th');head.textContent=(i<11?'1F ':'2F ')+name;row.append(head);for(let d=0;d<days;d++){const c=document.createElement('td'),v=data[d][i];c.textContent=v?(v.name||'済'):'';row.append(c)}tbody.append(row)});table.append(tbody);$('printSheet').replaceChildren();const title=document.createElement('h1');title.textContent=year+'年'+m+'月　月間清掃記録';$('printSheet').append(title,table);$('printStatus').textContent=month+' の記録を読み込みました。印刷プレビューを開いてください';$('printPreviewButton').style.display='inline-block'}catch(e){$('printStatus').textContent='履歴の取得に失敗しました';showError('月間履歴',e)}finally{$('printButton').disabled=false}};
update();checkDay();if(!staff)askStaff();setInterval(checkDay,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();if(authReady&&!online)connectDay()}});
