  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 1190.55 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  xref[4]=offset;add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pxWidth+' /Height '+pxHeight+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');add(jpeg);add('\nendstream\nendobj\n');
  const stream='q\n1190.55 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
  obj(5,'<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'endstream');
  const startxref=offset;
  add('xref\n0 6\n0000000000 65535 f \n');
  for(let n=1;n<=5;n++)add(String(xref[n]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+startxref+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function renderMonthlyPdf(){
  const source=$('printSheet');const table=source.querySelector('table');
  if(!table)throw new Error('月間記録を先に読み込んでください');
  const month=$('printMonth').value;
  const days=table.tHead.rows[0].cells.length-1;
  const width=2480,height=1754;
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('PDF描画に対応していません');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 45px sans-serif';ctx.fillText(source.querySelector('h1')?.textContent||month+' 月間清掃記録',width/2,90);
  const x0=70,y0=165,tableWidth=width-140,tableHeight=height-245;
  const labelWidth=300,colWidth=(tableWidth-labelWidth)/days,rowHeight=tableHeight/16;
  ctx.strokeStyle='#555';ctx.lineWidth=1.5;
  for(let r=0;r<=16;r++){const y=y0+r*rowHeight;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+tableWidth,y);ctx.stroke()}
  for(let d=0;d<=days;d++){const x=x0+labelWidth+d*colWidth;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+tableHeight);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,y0+tableHeight);ctx.stroke();
  ctx.fillStyle='#f1f1f1';ctx.fillRect(x0+1,y0+1,tableWidth-2,rowHeight-2);
  ctx.fillStyle='#111';ctx.font='bold 27px sans-serif';ctx.fillText('清掃場所',x0+labelWidth/2,y0+rowHeight/2);
  for(let d=0;d<days;d++)ctx.fillText(String(d+1),x0+labelWidth+(d+.5)*colWidth,y0+rowHeight/2);
  for(let i=0;i<15;i++){
    const row=table.tBodies[0].rows[i];
    ctx.textAlign='left';ctx.font='bold 23px sans-serif';ctx.fillText(row.cells[0].textContent,x0+12,y0+(i+1.5)*rowHeight);
    ctx.textAlign='center';
    for(let d=0;d<days;d++){
      const value=row.cells[d+1].textContent;
      if(!value)continue;
      const maxWidth=colWidth-5;
      let size=23;ctx.font=size+'px sans-serif';
      while(size>11&&ctx.measureText(value).width>maxWidth){size--;ctx.font=size+'px sans-serif'}
      ctx.fillText(value,x0+labelWidth+(d+.5)*colWidth,y0+(i+1.5)*rowHeight,maxWidth);
    }
  }
  return createPdfFromJpeg(canvas.toDataURL('image/jpeg',0.85),width,height);
}
$('pdfCreateButton').onclick=()=>{
  const btn=$('pdfCreateButton');btn.disabled=true;$('pdfStatus').textContent='PDFを作成中…';
  setTimeout(()=>{
    try{
      const blob=renderMonthlyPdf();
      if(pdfObjectUrl)URL.revokeObjectURL(pdfObjectUrl);
      pdfObjectUrl=URL.createObjectURL(blob);
      $('pdfOpenLink').href=pdfObjectUrl;
      $('pdfOpenLink').style.display='inline-block';
      $('pdfStatus').textContent='PDFを作成しました。緑の「作成したPDFを開く」を押してください。';
    }catch(e){$('pdfStatus').textContent='PDF作成に失敗しました：'+e.message;console.error(e)}
    finally{btn.disabled=false}
  },40);
};
